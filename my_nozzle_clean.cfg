# =====================================================================
# Snapmaker U1 - Clean All Nozzles
# =====================================================================
#
# Uses Snapmaker's factory extruder-offset preparation actions to clean
# all four nozzles WITHOUT performing extruder offset calibration.
#
#
# BASIC USE:
#
#   CLEAN_ALL_NOZZLES
#
# Defaults all four tools to 270C.
#
#
# CUSTOM TEMPERATURES:
#
#   CLEAN_ALL_NOZZLES T0=230 T1=230 T2=270 T3=270
#
#
# Factory sequence used for each tool:
#
#   HEAT
#     |
#     v
#   AUTO_CLEAN
#     - Move to discard position
#     - Purge
#     - Retract
#     - Cut filament
#     - Rough-clean nozzle
#     - Discard filament
#     - Return tool
#     |
#     v
#   MANUAL_CLEAN
#     - Select tool
#     - Move to Z150
#     - Move to X135 Y5
#     - This is where the factory offset-calibration UI normally
#       presents the nozzle for manual cleaning.
#     |
#     v
#   WAIT_COOL
#     - Aux/cavity fan ON
#     - Part/gantry fan ON
#     - Move to X5 Y140
#     - Cool nozzle to 65C
#     - Fans OFF
#
# Then proceed to next tool.
#
#
# IMPORTANT:
#
# No PROBE_CALIBRATE or offset-calibration command is called.
#
# =====================================================================


[gcode_macro CLEAN_ALL_NOZZLES]
description: Factory-style cleaning of all four U1 nozzles without offset calibration
gcode:

    # ---------------------------------------------------------------
    # USER PARAMETERS
    # ---------------------------------------------------------------

    {% set temp_t0 = params.T0|default(270)|float %}
    {% set temp_t1 = params.T1|default(270)|float %}
    {% set temp_t2 = params.T2|default(270)|float %}
    {% set temp_t3 = params.T3|default(270)|float %}

    {% set cool_temp = params.COOL|default(65)|float %}


    # ---------------------------------------------------------------
    # START
    # ---------------------------------------------------------------

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="Starting factory-style nozzle cleaning"

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T0={temp_t0}C T1={temp_t1}C T2={temp_t2}C T3={temp_t3}C"

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="Final cooling temperature = {cool_temp}C"

    SET_LED LED=cavity_led WHITE=1


    # ===============================================================
    # T0
    # ===============================================================

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T0 - Heating"

    EXTRUDER_OFFSET_ACTION_HEAT TOOL_ID=T0 HEAT_TEMP={temp_t0}


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T0 - Automatic purge and cleaning"

    EXTRUDER_OFFSET_ACTION_AUTO_CLEAN TOOL_ID=T0


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T0 - Manual cleaning"

    EXTRUDER_OFFSET_ACTION_MANUAL_CLEAN TOOL_ID=T0


    # ---------------------------------------------------------------
    # FALLBACK MANUAL-CLEAN WAIT
    #
    # If Snapmaker's native cleaning guide appears AND waits for the
    # user to press OK, this delay can be removed later.
    # ---------------------------------------------------------------

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T0 - Clean nozzle now"

    G4 P10000


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T0 - Cooling"

    EXTRUDER_OFFSET_ACTION_WAIT_COOL TOOL_ID=T0 TEMP={cool_temp}

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T0 complete"


    # ===============================================================
    # T1
    # ===============================================================

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T1 - Heating"

    EXTRUDER_OFFSET_ACTION_HEAT TOOL_ID=T1 HEAT_TEMP={temp_t1}


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T1 - Automatic purge and cleaning"

    EXTRUDER_OFFSET_ACTION_AUTO_CLEAN TOOL_ID=T1


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T1 - Manual cleaning"

    EXTRUDER_OFFSET_ACTION_MANUAL_CLEAN TOOL_ID=T1


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T1 - Clean nozzle now"

    G4 P10000


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T1 - Cooling"

    EXTRUDER_OFFSET_ACTION_WAIT_COOL TOOL_ID=T1 TEMP={cool_temp}

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T1 complete"


    # ===============================================================
    # T2
    # ===============================================================

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T2 - Heating"

    EXTRUDER_OFFSET_ACTION_HEAT TOOL_ID=T2 HEAT_TEMP={temp_t2}


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T2 - Automatic purge and cleaning"

    EXTRUDER_OFFSET_ACTION_AUTO_CLEAN TOOL_ID=T2


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T2 - Manual cleaning"

    EXTRUDER_OFFSET_ACTION_MANUAL_CLEAN TOOL_ID=T2


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T2 - Clean nozzle now"

    G4 P10000


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T2 - Cooling"

    EXTRUDER_OFFSET_ACTION_WAIT_COOL TOOL_ID=T2 TEMP={cool_temp}

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T2 complete"


    # ===============================================================
    # T3
    # ===============================================================

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T3 - Heating"

    EXTRUDER_OFFSET_ACTION_HEAT TOOL_ID=T3 HEAT_TEMP={temp_t3}


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T3 - Automatic purge and cleaning"

    EXTRUDER_OFFSET_ACTION_AUTO_CLEAN TOOL_ID=T3


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T3 - Manual cleaning"

    EXTRUDER_OFFSET_ACTION_MANUAL_CLEAN TOOL_ID=T3


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T3 - Clean nozzle now"

    G4 P10000


    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T3 - Cooling"

    EXTRUDER_OFFSET_ACTION_WAIT_COOL TOOL_ID=T3 TEMP={cool_temp}

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="T3 complete"


    # ===============================================================
    # FINISH
    # ===============================================================

    TURN_OFF_HEATERS

    SET_FAN_SPEED FAN=cavity_fan SPEED=0
    M106 S0

    MOVE_TO_XY_IDLE_POSITION_EXTRUDER

    RESPOND PREFIX="NOZZLE CLEAN:" MSG="All four nozzles cleaned"