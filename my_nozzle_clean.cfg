# =====================================================================
# Snapmaker U1 - Standalone Clean All Nozzles
# =====================================================================
#
# PURPOSE:
#
# Cleans all four U1 nozzles without entering the
# XYZ_OFFSET_CALIBRATE state machine.
#
# SAFETY / OPERATION:
#
# - Cavity LED turns ON at the beginning of the procedure.
# - XYZ is homed before cleaning begins.
# - Bed is moved to Z150 for manual-cleaning clearance.
# - Each tool is picked up BEFORE it is heated.
# - Default cleaning temperature is 200C.
# - Cleaning temperature may be overridden with TEMP=###.
# - Each nozzle is actively cooled to 70C before tool change.
# - At 70C, the nozzle heater target is changed to 0C.
# - The nozzle continues cooling naturally after it is parked.
# - Cavity fan returns to SPEED=0.001 after active cooling.
# - Cavity LED turns OFF when the entire procedure is complete.
#
# MANUAL CLEANING:
#
# After automatic cleaning, each nozzle is presented at X135 Y5.
#
# Mainsail displays a prompt giving the operator 10 seconds to
# manually brush the nozzle.
#
# The procedure automatically continues after 10 seconds.
#
# A "Continue Now" button is also provided. Pressing it cancels
# the pending timer and immediately continues the procedure.
#
# EXAMPLES:
#
#     CLEAN_ALL_NOZZLES
#
#         Clean at the default 200C.
#
#     CLEAN_ALL_NOZZLES TEMP=240
#
#         Clean all four nozzles at 240C.
#
#     CLEAN_ALL_NOZZLES TEMP=260
#
#         Clean all four nozzles at 260C.
#
# =====================================================================


# =====================================================================
# START
# =====================================================================

[gcode_macro CLEAN_ALL_NOZZLES]
description: Clean all four U1 nozzles. Optional TEMP=### overrides 200C default.
variable_clean_temp: 200
variable_manual_clean_time: 10
gcode:

    {% set clean_temp = params.TEMP|default(200)|float %}

    # Store requested cleaning temperature for later stages.
    SET_GCODE_VARIABLE MACRO=CLEAN_ALL_NOZZLES VARIABLE=clean_temp VALUE={clean_temp}

    # Cancel any old timers that may remain from an interrupted run.
    UPDATE_DELAYED_GCODE ID=_CLEAN_T0_AUTO_CONTINUE DURATION=0
    UPDATE_DELAYED_GCODE ID=_CLEAN_T1_AUTO_CONTINUE DURATION=0
    UPDATE_DELAYED_GCODE ID=_CLEAN_T2_AUTO_CONTINUE DURATION=0
    UPDATE_DELAYED_GCODE ID=_CLEAN_T3_AUTO_CONTINUE DURATION=0

    # Close any old Mainsail prompt.
    RESPOND TYPE=command MSG="action:prompt_end"

    # Turn cavity LED on for the entire cleaning procedure.
    SET_LED LED=cavity_led WHITE=1

    M117 Preparing nozzle cleaning

    # Home XYZ.
    G28

    # Lower bed for manual-cleaning clearance.
    G90
    G0 Z150 F1800

    # Begin T0.
    _CLEAN_NOZZLE_T0


# =====================================================================
# T0 - AUTOMATIC CLEAN
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_T0]
gcode:

    {% set clean_temp =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].clean_temp|float %}
    {% set manual_time =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].manual_clean_time|int %}

    M117 Cleaning T0

    # Pick T0 BEFORE heating.
    T0 A0

    # Move clear of dock / anti-ooze pad.
    MOVE_TO_DISCARD_FILAMENT_POSITION

    # Heat and wait.
    M109 T0 A0 S{clean_temp}

    SAVE_GCODE_STATE NAME=clean_all_t0

    G90
    M204 S10000
    M83

    # Standard Snapmaker purge/retract.
    G1 E30 F600
    G1 E-20 F1200

    # Automatic cut / brush / discard.
    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=4
    INNER_DISCARD_FILAMENT_BASE_DISCARD

    RESTORE_GCODE_STATE NAME=clean_all_t0

    # Present T0 for manual brushing.
    G90
    G0 X135 Y5 F12000

    M117 Brush T0 - auto continue in {manual_time}s

    RESPOND TYPE=command MSG="action:prompt_begin Manual Nozzle Cleaning - T0"
    RESPOND TYPE=command MSG="action:prompt_text Brush T0 now. Cleaning will automatically continue in {manual_time} seconds."
    RESPOND TYPE=command MSG="action:prompt_button Continue Now|_CLEAN_NOZZLE_CONTINUE_T0|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

    UPDATE_DELAYED_GCODE ID=_CLEAN_T0_AUTO_CONTINUE DURATION={manual_time}


# =====================================================================
# T0 - AUTO CONTINUE
# =====================================================================

[delayed_gcode _CLEAN_T0_AUTO_CONTINUE]
gcode:

    _CLEAN_NOZZLE_CONTINUE_T0


# =====================================================================
# T0 - CONTINUE / COOL
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_CONTINUE_T0]
gcode:

    # Cancel pending timer if Continue Now was pressed.
    UPDATE_DELAYED_GCODE ID=_CLEAN_T0_AUTO_CONTINUE DURATION=0

    # Close Mainsail prompt.
    RESPOND TYPE=command MSG="action:prompt_end"

    M117 Cooling T0 to 70C

    # Maximum cooling airflow.
    SET_FAN_SPEED FAN=cavity_fan SPEED=1
    M106 S255

    # Move away from dock while cooling.
    G90
    G0 X5 Y140 F12000

    # 70C is the safe tool-change threshold.
    M109 T0 A0 S70

    # Threshold reached. Remove heater target completely.
    M104 T0 A0 S0

    # Restore fan states.
    SET_FAN_SPEED FAN=cavity_fan SPEED=0.001
    M106 S0

    # Continue to T1.
    _CLEAN_NOZZLE_T1


# =====================================================================
# T1 - AUTOMATIC CLEAN
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_T1]
gcode:

    {% set clean_temp =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].clean_temp|float %}
    {% set manual_time =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].manual_clean_time|int %}

    M117 Cleaning T1

    # T0 is <=70C. Park T0 and pick T1.
    T1 A0

    # Move clear of dock before heating.
    MOVE_TO_DISCARD_FILAMENT_POSITION

    # Heat and wait.
    M109 T1 A0 S{clean_temp}

    SAVE_GCODE_STATE NAME=clean_all_t1

    G90
    M204 S10000
    M83

    G1 E30 F600
    G1 E-20 F1200

    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=4
    INNER_DISCARD_FILAMENT_BASE_DISCARD

    RESTORE_GCODE_STATE NAME=clean_all_t1

    # Present T1 for manual brushing.
    G90
    G0 X135 Y5 F12000

    M117 Brush T1 - auto continue in {manual_time}s

    RESPOND TYPE=command MSG="action:prompt_begin Manual Nozzle Cleaning - T1"
    RESPOND TYPE=command MSG="action:prompt_text Brush T1 now. Cleaning will automatically continue in {manual_time} seconds."
    RESPOND TYPE=command MSG="action:prompt_button Continue Now|_CLEAN_NOZZLE_CONTINUE_T1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

    UPDATE_DELAYED_GCODE ID=_CLEAN_T1_AUTO_CONTINUE DURATION={manual_time}


# =====================================================================
# T1 - AUTO CONTINUE
# =====================================================================

[delayed_gcode _CLEAN_T1_AUTO_CONTINUE]
gcode:

    _CLEAN_NOZZLE_CONTINUE_T1


# =====================================================================
# T1 - CONTINUE / COOL
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_CONTINUE_T1]
gcode:

    UPDATE_DELAYED_GCODE ID=_CLEAN_T1_AUTO_CONTINUE DURATION=0

    RESPOND TYPE=command MSG="action:prompt_end"

    M117 Cooling T1 to 70C

    SET_FAN_SPEED FAN=cavity_fan SPEED=1
    M106 S255

    G90
    G0 X5 Y140 F12000

    # Wait for safe tool-change temperature.
    M109 T1 A0 S70

    # Release heater target completely.
    M104 T1 A0 S0

    SET_FAN_SPEED FAN=cavity_fan SPEED=0.001
    M106 S0

    _CLEAN_NOZZLE_T2


# =====================================================================
# T2 - AUTOMATIC CLEAN
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_T2]
gcode:

    {% set clean_temp =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].clean_temp|float %}
    {% set manual_time =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].manual_clean_time|int %}

    M117 Cleaning T2

    # T1 is <=70C. Park T1 and pick T2.
    T2 A0

    # Move clear of dock before heating.
    MOVE_TO_DISCARD_FILAMENT_POSITION

    # Heat and wait.
    M109 T2 A0 S{clean_temp}

    SAVE_GCODE_STATE NAME=clean_all_t2

    G90
    M204 S10000
    M83

    G1 E30 F600
    G1 E-20 F1200

    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=4
    INNER_DISCARD_FILAMENT_BASE_DISCARD

    RESTORE_GCODE_STATE NAME=clean_all_t2

    # Present T2 for manual brushing.
    G90
    G0 X135 Y5 F12000

    M117 Brush T2 - auto continue in {manual_time}s

    RESPOND TYPE=command MSG="action:prompt_begin Manual Nozzle Cleaning - T2"
    RESPOND TYPE=command MSG="action:prompt_text Brush T2 now. Cleaning will automatically continue in {manual_time} seconds."
    RESPOND TYPE=command MSG="action:prompt_button Continue Now|_CLEAN_NOZZLE_CONTINUE_T2|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

    UPDATE_DELAYED_GCODE ID=_CLEAN_T2_AUTO_CONTINUE DURATION={manual_time}


# =====================================================================
# T2 - AUTO CONTINUE
# =====================================================================

[delayed_gcode _CLEAN_T2_AUTO_CONTINUE]
gcode:

    _CLEAN_NOZZLE_CONTINUE_T2


# =====================================================================
# T2 - CONTINUE / COOL
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_CONTINUE_T2]
gcode:

    UPDATE_DELAYED_GCODE ID=_CLEAN_T2_AUTO_CONTINUE DURATION=0

    RESPOND TYPE=command MSG="action:prompt_end"

    M117 Cooling T2 to 70C

    SET_FAN_SPEED FAN=cavity_fan SPEED=1
    M106 S255

    G90
    G0 X5 Y140 F12000

    # Wait for safe tool-change temperature.
    M109 T2 A0 S70

    # Release heater target completely.
    M104 T2 A0 S0

    SET_FAN_SPEED FAN=cavity_fan SPEED=0.001
    M106 S0

    _CLEAN_NOZZLE_T3


# =====================================================================
# T3 - AUTOMATIC CLEAN
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_T3]
gcode:

    {% set clean_temp =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].clean_temp|float %}
    {% set manual_time =
        printer["gcode_macro CLEAN_ALL_NOZZLES"].manual_clean_time|int %}

    M117 Cleaning T3

    # T2 is <=70C. Park T2 and pick T3.
    T3 A0

    # Move clear of dock before heating.
    MOVE_TO_DISCARD_FILAMENT_POSITION

    # Heat and wait.
    M109 T3 A0 S{clean_temp}

    SAVE_GCODE_STATE NAME=clean_all_t3

    G90
    M204 S10000
    M83

    G1 E30 F600
    G1 E-20 F1200

    INNER_CUTOFF_BASE_DISCARD
    INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=4
    INNER_DISCARD_FILAMENT_BASE_DISCARD

    RESTORE_GCODE_STATE NAME=clean_all_t3

    # Present T3 for manual brushing.
    G90
    G0 X135 Y5 F12000

    M117 Brush T3 - auto continue in {manual_time}s

    RESPOND TYPE=command MSG="action:prompt_begin Manual Nozzle Cleaning - T3"
    RESPOND TYPE=command MSG="action:prompt_text Brush T3 now. Cleaning will automatically continue in {manual_time} seconds."
    RESPOND TYPE=command MSG="action:prompt_button Continue Now|_CLEAN_NOZZLE_FINISH|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

    UPDATE_DELAYED_GCODE ID=_CLEAN_T3_AUTO_CONTINUE DURATION={manual_time}


# =====================================================================
# T3 - AUTO CONTINUE
# =====================================================================

[delayed_gcode _CLEAN_T3_AUTO_CONTINUE]
gcode:

    _CLEAN_NOZZLE_FINISH


# =====================================================================
# T3 - CONTINUE / FINISH
# =====================================================================

[gcode_macro _CLEAN_NOZZLE_FINISH]
gcode:

    # Cancel pending timer if Continue Now was pressed.
    UPDATE_DELAYED_GCODE ID=_CLEAN_T3_AUTO_CONTINUE DURATION=0

    # Close Mainsail prompt.
    RESPOND TYPE=command MSG="action:prompt_end"

    M117 Cooling T3 to 70C

    SET_FAN_SPEED FAN=cavity_fan SPEED=1
    M106 S255

    G90
    G0 X5 Y140 F12000

    # Wait for safe parking temperature.
    M109 T3 A0 S70

    # 70C reached. Release heater target completely.
    M104 T3 A0 S0

    # Ensure every heater target is off.
    TURN_OFF_HEATERS

    # Return cavity fan to normal baseline.
    SET_FAN_SPEED FAN=cavity_fan SPEED=0.001
    M106 S0

    # Turn cavity LED back off.
    SET_LED LED=cavity_led WHITE=0

    M117 Nozzle cleaning complete

    RESPOND MSG="CLEAN_ALL_NOZZLES: All four nozzles cleaned."
