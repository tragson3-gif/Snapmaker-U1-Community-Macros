# =====================================================================
# Snapmaker U1 - Per-Tool Automatic Flow Calibration Flags
# =====================================================================
#
# PURPOSE:
#
# When changing a filament roll, press the corresponding macro:
#
#     FLOW_CAL_T0
#     FLOW_CAL_T1
#     FLOW_CAL_T2
#     FLOW_CAL_T3
#
# The next print calls CALIBRATE_FLAGGED_TOOLS.
#
# For every flagged tool:
#     1. Pick that physical tool
#     2. Run Snapmaker's native FLOW_CALIBRATE
#     3. Snapmaker determines filament and calibration temperature
#     4. Clear that tool's flag
#
#
# Other controls:
#
#     FLOW_CAL_ALL        - Flag all four tools
#     FLOW_CAL_CLEAR_ALL  - Clear all flags
#     FLOW_CAL_STATUS     - Display current flags
#
# =====================================================================



# =====================================================================
# T0 FLAG
# =====================================================================

[gcode_macro FLOW_CAL_T0]
description: Flag T0 for flow calibration on next print
variable_flag: 0
gcode:
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T0 VARIABLE=flag VALUE=1
    RESPOND PREFIX="FLOW:" MSG="T0 marked for flow calibration"


# =====================================================================
# T1 FLAG
# =====================================================================

[gcode_macro FLOW_CAL_T1]
description: Flag T1 for flow calibration on next print
variable_flag: 0
gcode:
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T1 VARIABLE=flag VALUE=1
    RESPOND PREFIX="FLOW:" MSG="T1 marked for flow calibration"


# =====================================================================
# T2 FLAG
# =====================================================================

[gcode_macro FLOW_CAL_T2]
description: Flag T2 for flow calibration on next print
variable_flag: 0
gcode:
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T2 VARIABLE=flag VALUE=1
    RESPOND PREFIX="FLOW:" MSG="T2 marked for flow calibration"


# =====================================================================
# T3 FLAG
# =====================================================================

[gcode_macro FLOW_CAL_T3]
description: Flag T3 for flow calibration on next print
variable_flag: 0
gcode:
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T3 VARIABLE=flag VALUE=1
    RESPOND PREFIX="FLOW:" MSG="T3 marked for flow calibration"



# =====================================================================
# FLAG ALL TOOLS
# =====================================================================

[gcode_macro FLOW_CAL_ALL]
description: Flag all four tools for flow calibration
gcode:
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T0 VARIABLE=flag VALUE=1
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T1 VARIABLE=flag VALUE=1
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T2 VARIABLE=flag VALUE=1
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T3 VARIABLE=flag VALUE=1

    RESPOND PREFIX="FLOW:" MSG="T0 T1 T2 T3 marked for flow calibration"



# =====================================================================
# CLEAR ALL FLAGS
# =====================================================================

[gcode_macro FLOW_CAL_CLEAR_ALL]
description: Clear all pending flow calibration flags
gcode:
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T0 VARIABLE=flag VALUE=0
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T1 VARIABLE=flag VALUE=0
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T2 VARIABLE=flag VALUE=0
    SET_GCODE_VARIABLE MACRO=FLOW_CAL_T3 VARIABLE=flag VALUE=0

    RESPOND PREFIX="FLOW:" MSG="All pending flow calibration flags cleared"



# =====================================================================
# SHOW FLAG STATUS
# =====================================================================

[gcode_macro FLOW_CAL_STATUS]
description: Show pending flow calibration flags
gcode:
    {% set t0 = printer["gcode_macro FLOW_CAL_T0"].flag|int %}
    {% set t1 = printer["gcode_macro FLOW_CAL_T1"].flag|int %}
    {% set t2 = printer["gcode_macro FLOW_CAL_T2"].flag|int %}
    {% set t3 = printer["gcode_macro FLOW_CAL_T3"].flag|int %}

    RESPOND PREFIX="FLOW:" MSG="Pending calibration: T0={t0} T1={t1} T2={t2} T3={t3}"



# =====================================================================
# AUTOMATIC PRINT-START CALIBRATION
# =====================================================================
#
# Called ONCE by Orca at the beginning of every print:
#
#     CALIBRATE_FLAGGED_TOOLS
#
# No temperatures need to be supplied.
#
# Snapmaker's native FLOW_CALIBRATE determines:
#
#     - Active physical tool
#     - Loaded filament
#     - Calibration parameters
#     - Calibration temperature
#
# =====================================================================

[gcode_macro CALIBRATE_FLAGGED_TOOLS]
description: Automatically flow calibrate all flagged U1 tools
gcode:

    # -------------------------------------------------------------
    # Read current flags
    # -------------------------------------------------------------

    {% set t0 = printer["gcode_macro FLOW_CAL_T0"].flag|int %}
    {% set t1 = printer["gcode_macro FLOW_CAL_T1"].flag|int %}
    {% set t2 = printer["gcode_macro FLOW_CAL_T2"].flag|int %}
    {% set t3 = printer["gcode_macro FLOW_CAL_T3"].flag|int %}


    RESPOND PREFIX="FLOW:" MSG="Calibration check: T0={t0} T1={t1} T2={t2} T3={t3}"


    # =================================================================
    # T0
    # =================================================================

    {% if t0 == 1 %}

        RESPOND PREFIX="FLOW:" MSG="T0 flagged - starting calibration"

        T0

        FLOW_CALIBRATE FORCE=1

        SET_GCODE_VARIABLE MACRO=FLOW_CAL_T0 VARIABLE=flag VALUE=0

        RESPOND PREFIX="FLOW:" MSG="T0 calibration command completed - flag cleared"

    {% endif %}


    # =================================================================
    # T1
    # =================================================================

    {% if t1 == 1 %}

        RESPOND PREFIX="FLOW:" MSG="T1 flagged - starting calibration"

        T1

        FLOW_CALIBRATE FORCE=1

        SET_GCODE_VARIABLE MACRO=FLOW_CAL_T1 VARIABLE=flag VALUE=0

        RESPOND PREFIX="FLOW:" MSG="T1 calibration command completed - flag cleared"

    {% endif %}


    # =================================================================
    # T2
    # =================================================================

    {% if t2 == 1 %}

        RESPOND PREFIX="FLOW:" MSG="T2 flagged - starting calibration"

        T2

        FLOW_CALIBRATE FORCE=1

        SET_GCODE_VARIABLE MACRO=FLOW_CAL_T2 VARIABLE=flag VALUE=0

        RESPOND PREFIX="FLOW:" MSG="T2 calibration command completed - flag cleared"

    {% endif %}


    # =================================================================
    # T3
    # =================================================================

    {% if t3 == 1 %}

        RESPOND PREFIX="FLOW:" MSG="T3 flagged - starting calibration"

        T3

        FLOW_CALIBRATE FORCE=1

        SET_GCODE_VARIABLE MACRO=FLOW_CAL_T3 VARIABLE=flag VALUE=0

        RESPOND PREFIX="FLOW:" MSG="T3 calibration command completed - flag cleared"

    {% endif %}


    # =================================================================
    # FINISHED
    # =================================================================

    RESPOND PREFIX="FLOW:" MSG="Flagged flow calibration check complete"