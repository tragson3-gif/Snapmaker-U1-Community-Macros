# =====================================================================
# Snapmaker U1 - Flow Calibration Macros
# =====================================================================
#
# IMPORTANT:
#
# FLOW_CALIBRATE TARGET=... does NOT select/pick the requested tool.
# The desired tool must be physically selected FIRST with T0/T1/T2/T3.
#
# Tool mapping:
#
#   T0 -> extruder
#   T1 -> extruder1
#   T2 -> extruder2
#   T3 -> extruder3
#
# Examples:
#
#   T0
#   FLOW_CALIBRATE TARGET=extruder TEMP=220
#
#   T3
#   FLOW_CALIBRATE TARGET=extruder3 TEMP=240
#
# =====================================================================


# ---------------------------------------------------------------------
# CALIBRATE T0
# ---------------------------------------------------------------------

[gcode_macro CALIBRATE_FLOW_T0]
description: Calibrate flow for U1 Tool 0
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    RESPOND PREFIX="FLOW:" MSG="Selecting T0 for flow calibration"

    T0

    RESPOND PREFIX="FLOW:" MSG="Calibrating T0 at {TEMP}C"

    FLOW_CALIBRATE TARGET=extruder TEMP={TEMP}


# ---------------------------------------------------------------------
# CALIBRATE T1
# ---------------------------------------------------------------------

[gcode_macro CALIBRATE_FLOW_T1]
description: Calibrate flow for U1 Tool 1
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    RESPOND PREFIX="FLOW:" MSG="Selecting T1 for flow calibration"

    T1

    RESPOND PREFIX="FLOW:" MSG="Calibrating T1 at {TEMP}C"

    FLOW_CALIBRATE TARGET=extruder1 TEMP={TEMP}


# ---------------------------------------------------------------------
# CALIBRATE T2
# ---------------------------------------------------------------------

[gcode_macro CALIBRATE_FLOW_T2]
description: Calibrate flow for U1 Tool 2
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    RESPOND PREFIX="FLOW:" MSG="Selecting T2 for flow calibration"

    T2

    RESPOND PREFIX="FLOW:" MSG="Calibrating T2 at {TEMP}C"

    FLOW_CALIBRATE TARGET=extruder2 TEMP={TEMP}


# ---------------------------------------------------------------------
# CALIBRATE T3
# ---------------------------------------------------------------------

[gcode_macro CALIBRATE_FLOW_T3]
description: Calibrate flow for U1 Tool 3
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    RESPOND PREFIX="FLOW:" MSG="Selecting T3 for flow calibration"

    T3

    RESPOND PREFIX="FLOW:" MSG="Calibrating T3 at {TEMP}C"

    FLOW_CALIBRATE TARGET=extruder3 TEMP={TEMP}


# =====================================================================
# CALIBRATE ALL FOUR
# =====================================================================
#
# TEMP defaults to 220C.
#
# Example:
#
#   CALIBRATE_ALL_FLOW
#
# Or:
#
#   CALIBRATE_ALL_FLOW TEMP=240
#
# =====================================================================

[gcode_macro CALIBRATE_ALL_FLOW]
description: Calibrate flow on all four U1 toolheads
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    RESPOND PREFIX="FLOW:" MSG="Starting flow calibration for all four tools at {TEMP}C"

    T0
    FLOW_CALIBRATE TARGET=extruder TEMP={TEMP}

    T1
    FLOW_CALIBRATE TARGET=extruder1 TEMP={TEMP}

    T2
    FLOW_CALIBRATE TARGET=extruder2 TEMP={TEMP}

    T3
    FLOW_CALIBRATE TARGET=extruder3 TEMP={TEMP}

    RESPOND PREFIX="FLOW:" MSG="All requested flow calibrations have been submitted"