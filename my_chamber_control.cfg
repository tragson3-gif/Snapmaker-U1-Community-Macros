# =====================================================================
# Snapmaker U1 - Adaptive Chamber Cooling
# =====================================================================
#
# Examples:
#
#   START_CHAMBER_COOLING TARGET=42 RANGE=10
#   STOP_CHAMBER_COOLING
#
#
# TARGET
#   Desired chamber temperature.
#
# RANGE
#   Controls how strongly temperature error changes exhaust speed.
#   RANGE=10 means:
#
#       1C error = 5% fan correction
#
#   This preserves the smooth response of the original RANGE=10
#   controller.
#
#
# ADAPTIVE BASELINE
#
#   The controller starts each print assuming 50% exhaust is required
#   to maintain TARGET.
#
#   It then slowly learns the exhaust speed actually required.
#
#   Example:
#
#       Target = 42C
#       Chamber remains at 40C
#       Baseline slowly decreases:
#
#           50% -> 49% -> 48% -> ...
#
#       This allows the chamber to rise toward 42C.
#
#   If the chamber remains above TARGET, the baseline slowly increases.
#
#   Once TARGET is reached, the learned baseline becomes the approximate
#   fan speed required to maintain that temperature for THIS print.
#
#   The learned value is reset when START_CHAMBER_COOLING is called.
#
# =====================================================================


[gcode_macro START_CHAMBER_COOLING]
description: Start adaptive Top Cover exhaust temperature control

variable_enabled: 0
variable_target: 40.0
variable_range: 10.0
variable_baseline: -1.0

gcode:
    {% set TARGET = params.TARGET|default(40)|float %}
    {% set RANGE = params.RANGE|default(10)|float %}

    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=target VALUE={TARGET}
    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=range VALUE={RANGE}

    # -1 means initial warm-up / not learned yet
    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=baseline VALUE=-1.0

    RESPOND PREFIX="CHAMBER:" MSG="Adaptive cooling started - Target={TARGET}C Range={RANGE}C"

    UPDATE_DELAYED_GCODE ID=CHAMBER_COOLING_LOOP DURATION=1


[gcode_macro SET_CHAMBER_TARGET]
description: Change chamber target without resetting adaptive learning
gcode:
    {% set TARGET = params.TARGET|default(40)|float %}
    {% set RANGE = params.RANGE|default(10)|float %}

    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=target VALUE={TARGET}
    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=range VALUE={RANGE}

    RESPOND PREFIX="CHAMBER:" MSG="Target updated - Target={TARGET}C Range={RANGE}C - baseline preserved"


[gcode_macro STOP_CHAMBER_COOLING]
description: Stop adaptive Top Cover exhaust temperature control
gcode:
    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_COOLING_LOOP DURATION=0

    # U1 quirk: 0.001 physically stops the exhaust
    SET_PURIFIER FAN=exhaust SPEED=0.001

    RESPOND PREFIX="CHAMBER:" MSG="Adaptive cooling stopped"


[delayed_gcode CHAMBER_COOLING_LOOP]
gcode:
    {% set ctl = printer["gcode_macro START_CHAMBER_COOLING"] %}
    {% set temp = printer["temperature_sensor cavity"].temperature|float %}
    {% set target = ctl.target|float %}
    {% set range = ctl.range|float %}
    {% set baseline = ctl.baseline|float %}

    {% if ctl.enabled|int == 1 %}

        # INITIAL WARM-UP
        # baseline < 0 means adaptive control has not started yet
        {% if baseline < 0.0 and temp < (target - 1.0) %}

            SET_PURIFIER FAN=exhaust SPEED=0.001

            RESPOND PREFIX="CHAMBER:" MSG="Temp={temp}C Target={target}C - WARMING - Exhaust=OFF"

        {% else %}

            # If baseline is still negative, we just reached
            # target - 1C for the first time. Start fresh at 50%.
            {% if baseline < 0.0 %}
                {% set baseline = 0.50 %}
            {% endif %}

            {% set error = temp - target %}

            # Learn baseline
            {% if error <= -1.0 %}
                {% set learned = baseline - 0.01 %}
            {% elif error >= 1.0 %}
                {% set learned = baseline + 0.01 %}
            {% else %}
                {% set learned = baseline %}
            {% endif %}

            # Clamp learned baseline
            {% if learned < 0.0 %}
                {% set learned = 0.0 %}
            {% elif learned > 1.0 %}
                {% set learned = 1.0 %}
            {% endif %}

            SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=baseline VALUE={learned}

            # RANGE correction
            {% set correction = error / (2.0 * range) %}
            {% set speed = learned + correction %}

            # Clamp exhaust
            {% if speed < 0.001 %}
                {% set speed = 0.001 %}
            {% elif speed > 1.0 %}
                {% set speed = 1.0 %}
            {% endif %}

            SET_PURIFIER FAN=exhaust SPEED={speed}

            RESPOND PREFIX="CHAMBER:" MSG="Temp={temp}C Target={target}C Range={range}C Base={learned} Exhaust={speed}"

        {% endif %}

        UPDATE_DELAYED_GCODE ID=CHAMBER_COOLING_LOOP DURATION=15

    {% endif %}

# Do NOT use SPEED=0 - it triggers Top Hat disconnect.
# SPEED=0.001 physically stops the exhaust fan.


# =========================================================
# POST-PRINT AIR CLEANING
#
# Stage 1:
#   Internal recirculation 100% for 10 minutes
#
# Stage 2:
#   Internal OFF
#   Exhaust 80% for 2 minutes
#
# Stage 3:
#   Exhaust OFF
#
# A new print should call CANCEL_POST_PRINT_CLEANUP.
#
# IMPORTANT:
# SPEED=0 causes Top Hat problems.
# SPEED=0.001 physically stops the fan.
# =========================================================


[gcode_macro START_POST_PRINT_CLEANUP]
description: Start post-print filtration and exhaust cycle
variable_active: 0
gcode:
    # Stop chamber temperature controller
    SET_GCODE_VARIABLE MACRO=START_CHAMBER_COOLING VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_COOLING_LOOP DURATION=0

    # Cancel any old cleanup timers
    UPDATE_DELAYED_GCODE ID=POST_PRINT_EXHAUST DURATION=0
    UPDATE_DELAYED_GCODE ID=POST_PRINT_FINISH DURATION=0

    # Mark cleanup active
    SET_GCODE_VARIABLE MACRO=START_POST_PRINT_CLEANUP VARIABLE=active VALUE=1

    # Stage 1 - Filter internally for 10 minutes
    SET_PURIFIER FAN=exhaust SPEED=0.001
    SET_PURIFIER FAN=inner SPEED=1.0

    # Start Stage 2 in 600 seconds
    UPDATE_DELAYED_GCODE ID=POST_PRINT_EXHAUST DURATION=600


[delayed_gcode POST_PRINT_EXHAUST]
gcode:
    {% set cleanup = printer["gcode_macro START_POST_PRINT_CLEANUP"] %}

    {% if cleanup.active|int == 1 %}
        # Stage 2 - Stop recirculation and exhaust at 80%
        SET_PURIFIER FAN=inner SPEED=0.001
        SET_PURIFIER FAN=exhaust SPEED=0.80

        # Finish after another 120 seconds
        UPDATE_DELAYED_GCODE ID=POST_PRINT_FINISH DURATION=120
    {% endif %}


[delayed_gcode POST_PRINT_FINISH]
gcode:
    {% set cleanup = printer["gcode_macro START_POST_PRINT_CLEANUP"] %}

    {% if cleanup.active|int == 1 %}
        # Stage 3 - Everything off
        SET_PURIFIER FAN=inner SPEED=0.001
        SET_PURIFIER FAN=exhaust SPEED=0.001

        SET_GCODE_VARIABLE MACRO=START_POST_PRINT_CLEANUP VARIABLE=active VALUE=0
    {% endif %}


[gcode_macro CANCEL_POST_PRINT_CLEANUP]
description: Cancel post-print air cleaning when a new print starts
gcode:
    # Mark inactive FIRST so a delayed stage cannot continue
    SET_GCODE_VARIABLE MACRO=START_POST_PRINT_CLEANUP VARIABLE=active VALUE=0

    # Cancel both timers
    UPDATE_DELAYED_GCODE ID=POST_PRINT_EXHAUST DURATION=0
    UPDATE_DELAYED_GCODE ID=POST_PRINT_FINISH DURATION=0

    # Release both Top Cover fans
    SET_PURIFIER FAN=inner SPEED=0.001
    SET_PURIFIER FAN=exhaust SPEED=0.001